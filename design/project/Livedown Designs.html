<style>
  :root {
    /* Catppuccin-adjacent, tightened for livedown */
    --ld-bg: #17171f;
    --ld-bg-2: #1e1e2a;
    --ld-bg-3: #262634;
    --ld-bg-4: #313244;
    --ld-border: #2a2a38;
    --ld-border-2: #3a3a4c;
    --ld-fg: #e4e4ec;
    --ld-fg-2: #cdd6f4;
    --ld-fg-dim: #8a8aa0;
    --ld-fg-dimmer: #5e5e75;
    --ld-blue: #89b4fa;
    --ld-blue-hi: #b4d0ff;
    --ld-green: #a6e3a1;
    --ld-pink: #f38ba8;
    --ld-peach: #fab387;
    --ld-yellow: #f9e2af;
    --ld-mauve: #cba6f7;
    --ld-teal: #94e2d5;
    --ld-rosewater: #eba0ac;

    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }

  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: var(--sans); }
  * { box-sizing: border-box; }
</style>
</head>
