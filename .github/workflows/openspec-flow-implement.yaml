# =============================================================================
# OpenSpec Flow Implement
# =============================================================================
# Companion workflow to `openspec-flow.yaml`. Fires when a proposal PR
# (branch name `spec/<issue-number>-<slug>`) is merged into main, then
# drives the implementation stage of the OpenSpec lifecycle:
#
#   /opsx:apply  ──►  /opsx:verify  ──►  /opsx:archive
#
# All three skills run in sequence inside one agent invocation. The
# result is a single code PR containing:
#   - the implementation (new/edited source files per tasks.md)
#   - the archived change folder moved to `openspec/changes/archive/<name>/`
#   - updated main specs in `openspec/specs/`
#
# A human reviews and merges the code PR; merging closes the linked issue.
#
# -----------------------------------------------------------------------------
# NUMBERED OPERATIONS
# -----------------------------------------------------------------------------
# 1. Proposal PR merged            -> check-trigger          -> (none)              -> (none)
# 2. Extract issue + change name   -> check-trigger          -> (none)              -> (none)
# 3. Labels exist?                 -> verify-required-labels -> (none)              -> (none)
# 4. Skill scaffolding present?    -> verify-openspec-skills -> (none)              -> (none)
# 5. Flip label + comment          -> react-label-comment    -> openspec:implement  -> (none)
# 6. Runtime prepared              -> install-* steps        -> openspec:implement  -> CLI ready
# 7. APPLY + VERIFY + ARCHIVE      -> run-agent              -> openspec:implement  -> apply-change + verify-change + archive-change
# 8. Code PR opened                -> flip-label-success     -> openspec:review     -> (handoff)
# 9. Any stage failed              -> flip-label-failure     -> openspec:failed     -> (halt)
#
# -----------------------------------------------------------------------------
# WHERE THIS SITS IN THE OPENSPEC LIFECYCLE
# -----------------------------------------------------------------------------
#   Issue assigned       openspec-flow.yaml produces proposal PR
#          │
#          ▼
#   Proposal PR merged   >>> THIS WORKFLOW <<<
#          │             produces code PR via apply + verify + archive
#          ▼
#   Code PR merged       closes the issue (human review done)
#
# -----------------------------------------------------------------------------
# HOW TO TRIGGER
# -----------------------------------------------------------------------------
# Automatic only — triggered when a PR whose head branch matches `spec/**`
# is closed *with merge=true*. There is no manual-label equivalent for
# this workflow; the source of truth is "proposal was accepted", which
# only happens on merge.
#
# -----------------------------------------------------------------------------
# LABELS (must exist in the repo before first run)
# -----------------------------------------------------------------------------
#   openspec:spec-ready  — incoming state (set by openspec-flow.yaml)
#   openspec:implement   — this workflow is running
#   openspec:review      — code PR opened, awaiting human review
#   openspec:failed      — any workflow run failed
#
# -----------------------------------------------------------------------------
# SUB-AGENT
# -----------------------------------------------------------------------------
# Same sub-agent convention as openspec-flow.yaml. The prompt delegates
# to three OpenSpec skills in sequence:
#   - `openspec-apply-change`    — work through tasks.md, write code
#   - `openspec-verify-change`   — (optional) check impl matches spec
#   - `openspec-archive-change`  — move change folder to archive/, merge
#                                   delta specs into openspec/specs/
#
# -----------------------------------------------------------------------------
# CONFIGURABLE KNOBS
# -----------------------------------------------------------------------------
#   SUBAGENT_NAME            — sub-agent name the prompt delegates to
#   CLAUDE_CODE_ACTION_REF   — pinned tag of anthropics/claude-code-action
#   OPENSPEC_CLI_VERSION     — pinned version of @fission-ai/openspec
#   LABEL_SPEC_READY / IMPLEMENT / REVIEW / FAILED — label names
#
# -----------------------------------------------------------------------------
# OPEN QUESTIONS / FUTURE WORK
# -----------------------------------------------------------------------------
# - Auto-close the linked issue when the code PR merges (separate trigger).
# - Detect "agent ran but produced no PR" and fail loudly (shared concern
#   with openspec-flow.yaml — see that file's FUTURE WORK).
# - Cancel-via-label parity (`openspec:cancel` — see tasks.md).
#
# -----------------------------------------------------------------------------
# REQUIRED SECRETS
# -----------------------------------------------------------------------------
#   ANTHROPIC_API_KEY      — Anthropic API key for Claude Code
#
# OPTIONAL SECRETS
#   AGENT_GITHUB_TOKEN     — PAT for the agent bot identity. Falls back to
#                            github.token (github-actions[bot]) if unset.

name: OpenSpec Flow Implement

on:
  pull_request:
    types: [closed]
    branches: [main]

env:
  SUBAGENT_NAME: "openspec-flow-agent"
  CLAUDE_CODE_ACTION_REF: "v1.0.79"
  OPENSPEC_CLI_VERSION: "latest"
  LABEL_SPEC_READY: "openspec:spec-ready"
  LABEL_IMPLEMENT: "openspec:implement"
  LABEL_REVIEW: "openspec:review"
  LABEL_FAILED: "openspec:failed"

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

concurrency:
  group: openspec-flow-implement-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  openspec-flow-implement:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Fire only when:
      #   - the PR was actually merged (not just closed)
      #   - the head branch matches `spec/<issue-number>-*`
      # Also extract the issue number + change slug from the branch name
      # so downstream steps can use them.
      - name: Check trigger (proposal PR merge)
        id: check
        env:
          MERGED: ${{ github.event.pull_request.merged }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$MERGED" != "true" ]; then
            echo "PR closed without merge — skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$HEAD_REF" =~ ^spec/([0-9]+)-(.+)$ ]]; then
            echo "Head branch '$HEAD_REF' does not match spec/<n>-<slug> — skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          issue_number="${BASH_REMATCH[1]}"
          change_slug="${BASH_REMATCH[2]}"
          echo "Triggered by merge of $HEAD_REF (issue #$issue_number)"
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "change_slug=$change_slug" >> "$GITHUB_OUTPUT"

      # Idempotency + invariant: the linked issue should currently be in
      # `openspec:spec-ready` state. If it is not (e.g. a different
      # workflow already moved it on, or human intervention), refuse to
      # run rather than clobber state.
      - name: Verify issue is in spec-ready state
        id: verify-issue
        if: steps.check.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.check.outputs.issue_number }}
        run: |
          labels="$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json labels --jq '[.labels[].name] | join(",")' 2>/dev/null || echo "")"
          if ! echo ",$labels," | grep -q ",$LABEL_SPEC_READY,"; then
            echo "Issue #$ISSUE_NUMBER does not carry '$LABEL_SPEC_READY' (has: $labels) — skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Verify required labels exist
        if: steps.verify-issue.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.check.outputs.issue_number }}
        run: |
          missing=()
          for label in "$LABEL_SPEC_READY" "$LABEL_IMPLEMENT" "$LABEL_REVIEW" "$LABEL_FAILED"; do
            if ! gh label list --repo "$REPO" --search "$label" --json name \
                --jq '.[].name' | grep -Fxq "$label"; then
              missing+=("$label")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required labels: ${missing[*]}"
            {
              echo "> OpenSpec Flow Implement could not start: the following labels are missing from this repo:"
              echo ">"
              for label in "${missing[@]}"; do
                echo "> - \`$label\`"
              done
              echo ">"
              echo "> Create them with:"
              echo "> \`\`\`bash"
              echo "> gh label create 'openspec:implement' --repo $REPO --color 0052CC --description 'OpenSpec Flow: implement workflow running (apply + verify + archive)'"
              echo "> gh label create 'openspec:review'    --repo $REPO --color 0E8A16 --description 'OpenSpec Flow: code PR open, awaiting human review'"
              echo "> \`\`\`"
            } > /tmp/comment.md
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/comment.md
            exit 1
          fi

      - name: React, flip label, comment
        if: steps.verify-issue.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.check.outputs.issue_number }}
        run: |
          RUN_URL="${{ github.server_url }}/$REPO/actions/runs/${{ github.run_id }}"
          gh api -X POST "repos/$REPO/issues/$ISSUE_NUMBER/reactions" \
            -f content="rocket" >/dev/null || true
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" \
            --remove-label "$LABEL_SPEC_READY" \
            --add-label "$LABEL_IMPLEMENT"
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
            --body "> OpenSpec Flow Implement running — the code PR will open automatically when apply + verify + archive complete. [View run]($RUN_URL)"

      - name: Checkout repository
        if: steps.verify-issue.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}

      - name: Setup Node.js
        if: steps.verify-issue.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install OpenSpec CLI
        if: steps.verify-issue.outputs.run == 'true'
        run: |
          npm install -g "@fission-ai/openspec@${OPENSPEC_CLI_VERSION}"
          openspec --version

      # Proxy check for "OpenSpec installed in this repo" — same technique
      # as openspec-flow.yaml, but against the apply skill which is what
      # this workflow actually needs.
      - name: Verify OpenSpec skills present
        if: steps.verify-issue.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.check.outputs.issue_number }}
        run: |
          if [ ! -f .claude/skills/openspec-apply-change/SKILL.md ]; then
            echo "::error::OpenSpec apply skill missing — expected .claude/skills/openspec-apply-change/SKILL.md"
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
              --body "> OpenSpec Flow Implement could not start: OpenSpec apply skill not found. Run \`openspec init --tools claude\` locally and commit the \`.claude/\` folder."
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" \
              --remove-label "$LABEL_IMPLEMENT" \
              --add-label "$LABEL_FAILED" || true
            exit 1
          fi

      - name: Clone claude-code-action
        if: steps.verify-issue.outputs.run == 'true'
        run: |
          git clone --depth 1 --branch "$CLAUDE_CODE_ACTION_REF" \
            https://github.com/anthropics/claude-code-action.git \
            /tmp/claude-code-action

      - name: Install bun
        if: steps.verify-issue.outputs.run == 'true'
        run: curl -fsSL https://bun.sh/install | bash && echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install claude-code-action dependencies
        if: steps.verify-issue.outputs.run == 'true'
        run: cd /tmp/claude-code-action && bun install --production

      # Three-stage agent invocation: apply → verify → archive.
      # Delegates entirely to the OpenSpec skills — do not spell out
      # mechanics. See openspec-flow.yaml's run-agent step for the
      # ALL_INPUTS / CLAUDE_ARGS plumbing rationale.
      - name: Run OpenSpec Flow Implement agent
        if: steps.verify-issue.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
          OVERRIDE_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          GITHUB_ACTION_PATH: /tmp/claude-code-action
          ISSUE_NUMBER: ${{ steps.check.outputs.issue_number }}
          CHANGE_SLUG: ${{ steps.check.outputs.change_slug }}
          PROMPT: |
            Drive issue #${{ steps.check.outputs.issue_number }} in
            ${{ github.repository }} through the OpenSpec **implement**
            stage. The proposal PR (branch
            `${{ github.event.pull_request.head.ref }}`) was just merged
            into main, so the change folder is now on main.

            Run the work in a sub-agent called `${{ env.SUBAGENT_NAME }}`
            (or a generic one) so it stays in an isolated context.

            HOW
            OpenSpec ships skills that already encode HOW each stage
            operates — your job is orchestration, not mechanics. Trust
            the skills in `.claude/skills/openspec-*`.

            1. APPLY — invoke the `openspec-apply-change` skill to work
               through the change's `tasks.md`, writing the actual
               implementation (code files, tests, docs, etc).

            2. VERIFY — invoke the `openspec-verify-change` skill to
               check the implementation matches the spec. If verify
               surfaces issues, fix them via apply again before
               proceeding. Skip only if the skill reports nothing to
               verify.

            3. ARCHIVE — invoke the `openspec-archive-change` skill to
               move the change folder from `openspec/changes/<name>/`
               to `openspec/changes/archive/<name>/` and merge the
               delta specs into `openspec/specs/`.

            4. OPEN CODE PR — commit all changes (implementation +
               archived change folder + updated main specs) on a new
               branch `impl/${{ steps.check.outputs.issue_number }}-<slug>`.
               Open a PR titled
               `feat: implement spec for #${{ steps.check.outputs.issue_number }} <short title>`
               (use `fix:` / `chore:` prefix if more appropriate).

               PR body structure (in this exact order):
                 1. `Refs #${{ steps.check.outputs.issue_number }}`
                 2. blank line
                 3. a short paragraph (2-4 sentences) summarising what
                    was implemented, in your own words.
                 4. one line: "Implemented using the
                    `openspec-apply-change`, `openspec-verify-change`,
                    and `openspec-archive-change` skills."
                 5. a `---` horizontal rule
                 6. a bulleted list of the top-level file changes
                    (e.g. `src/foo.ts — added X`, `openspec/specs/... —
                    merged from delta`).

               Post one comment on the issue:
                 - one-paragraph recap of what was implemented
                 - a sentence naming the skills used
                 - a link to the code PR

               Do NOT assign the PR — `Refs` is enough.

            CONSTRAINTS
            - The change folder MUST end up under
              `openspec/changes/archive/<name>/` once you are done.
            - Conventional commit PR title required.
            - Follow the project writing style in CLAUDE.md if present.
        run: |
          # Same plumbing as openspec-flow.yaml — see that file for why.
          export CLAUDE_ARGS="--permission-mode bypassPermissions"
          ALL_INPUTS="$(jq -nc \
            --arg prompt "$PROMPT" \
            --arg api_key "$ANTHROPIC_API_KEY" \
            --arg gh_token "$GITHUB_TOKEN" \
            --arg claude_args "$CLAUDE_ARGS" \
            '{prompt: $prompt, anthropic_api_key: $api_key, github_token: $gh_token, claude_args: $claude_args}')"
          export ALL_INPUTS
          bun run /tmp/claude-code-action/src/entrypoints/run.ts

      - name: Flip label to openspec:review
        if: success() && steps.verify-issue.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.check.outputs.issue_number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" \
            --remove-label "$LABEL_IMPLEMENT" \
            --add-label "$LABEL_REVIEW"

      - name: Handle failure (flip label + comment)
        if: failure() && steps.verify-issue.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.check.outputs.issue_number }}
        run: |
          RUN_URL="${{ github.server_url }}/$REPO/actions/runs/${{ github.run_id }}"
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" \
            --remove-label "$LABEL_IMPLEMENT" \
            --add-label "$LABEL_FAILED" || true
          gh api "repos/$REPO/issues/$ISSUE_NUMBER/comments" \
            -f body="> OpenSpec Flow Implement failed. [View logs]($RUN_URL)"
